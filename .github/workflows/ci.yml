name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]
        include:
          - os: macos-15-intel
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install ruff==0.14.1
      - name: Static checks
        run: |
          ruff check prognostics tests scripts main.py
          ruff format --check prognostics tests scripts main.py
          python scripts/check_release.py
      - name: Causal and agent protocol tests (no API or external dataset)
        run: python -m unittest discover -s tests -v
      - name: Clean-install demo
        run: |
          mera-phm demo
          mera-phm predict --data data/demo --model artifacts/demo-model/model-bank.joblib --equipment 2 --row 8 --mode local
      - name: Dependency integrity
        run: python -m pip check

  neural:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - if: runner.os != 'macOS'
        run: python -m pip install "torch>=2.13,<2.15" --index-url https://download.pytorch.org/whl/cpu
      - if: runner.os == 'macOS'
        run: python -m pip install "torch>=2.13,<2.15"
      - run: python -m unittest discover -s tests -p test_neural.py -v
      - name: CPU neural demo and prediction
        run: |
          mera-phm demo --backend neural --device cpu --epochs 3 --output artifacts/neural-demo
          mera-phm predict --data data/demo --model artifacts/neural-demo/model-bank.joblib --equipment 2 --row 8 --mode local
