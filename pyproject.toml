[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mera-phm"
version = "1.0.0"
description = "Maintenance-aware evidence routing and auditable agents for multimodal prognostics"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "JJ Wang"}]
dependencies = [
  "numpy==2.5.4", "scipy==1.18.1", "scikit-learn==1.9.1", "pillow==12.3.0",
  "openai==3.29.0", "python-dotenv==1.2.4", "matplotlib==3.11.2", "joblib==1.6.0"
]

[project.scripts]
mera-phm = "prognostics.cli:main"

[tool.setuptools.packages.find]
include = ["prognostics*"]

[tool.setuptools.package-data]
prognostics = ["web/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
